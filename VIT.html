<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিটামিন ও অভাবজনিত রোগ - প্রিমিয়াম বায়োলজি কুইজ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #151c2c;
            --bg-card-hover: #1e293b;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 32px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .title-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .keyboard-hint {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }

        kbd {
            background: #222e45;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
            color: #f1f5f9;
            box-shadow: 0 2px 0 #0f172a;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            transition: width 0.3s ease;
        }

        .question-stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 28px;
            color: var(--text-primary);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-card:hover {
            background: var(--bg-card-hover);
            border-color: #475569;
            transform: translateY(-1px);
        }

        .option-card.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .option-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(16, 185, 129, 0.12) !important;
            box-shadow: 0 0 15px var(--accent-green-glow) !important;
        }

        .option-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(239, 68, 68, 0.12) !important;
        }

        .option-key {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-card.selected .option-key {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .option-card.correct .option-key {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }

        .option-card.incorrect .option-key {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
        }

        .option-val {
            font-size: 16px;
            font-weight: 500;
            flex-grow: 1;
        }

        .explanation-box {
            background: rgba(30, 41, 59, 0.7);
            border-left: 4px solid var(--accent-blue);
            padding: 16px 20px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 28px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .explanation-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .explanation-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .score-board {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-green) 0%, #1e293b 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            position: relative;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .score-circle-inner {
            width: 120px;
            height: 120px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .score-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .container { padding: 20px; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .keyboard-hint { display: none; }
            .question-text { font-size: 17px; }
            .option-card { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <div class="title-badge">
                <span class="badge">Medical Admission</span>
                <h1>ভিটামিন ও অভাবজনিত রোগ (কবীর স্যারের নোট)</h1>
            </div>
            <div class="keyboard-hint">
                <span>কিবোর্ড:</span>
                <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd>
                <span>নির্বাচন</span> | 
                <kbd>Enter</kbd>
                <span>পরবর্তী</span>
            </div>
        </div>

        <div class="question-stats">
            <span id="question-count">প্রশ্ন ১ / ১০</span>
            <span id="score-count">স্কোর: ০</span>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-text" id="question-text">প্রশ্ন লোড হচ্ছে...</div>

        <div class="options-grid" id="options-container"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="explanation-title">💡 ব্যাখ্যা ও সম্পর্কিত তথ্য:</div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>

        <div class="footer">
            <span style="font-size: 13px; color: var(--text-secondary);" id="status-hint">একটি উত্তর নির্বাচন করুন</span>
            <button class="btn" id="action-btn" disabled onclick="handleAction()">
                <span>জমা দিন</span>
                <kbd style="background: rgba(255,255,255,0.2); border: none; box-shadow: none;">↵</kbd>
            </button>
        </div>
    </div>

    <div class="score-board" id="score-screen">
        <h2 style="font-size: 28px; margin-bottom: 8px;">কুইজ সম্পন্ন হয়েছে! 🎉</h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">আপনার পারফরম্যান্স রিপোর্ট নিচে দেওয়া হলো</p>
        
        <div class="score-circle" id="score-circle">
            <div class="score-circle-inner">
                <span class="score-number" id="final-score">০%</span>
                <span class="score-label" id="score-fraction">০/০ সঠিক</span>
            </div>
        </div>

        <p id="feedback-text" style="font-size: 18px; font-weight: 600; margin-bottom: 32px; color: var(--accent-green);"></p>

        <button class="btn" style="margin: 0 auto;" onclick="restartQuiz()">
            <span>পুনরায় চেষ্টা করুন</span>
        </button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "ভিটামিন 'এ' এর রাসায়নিক নাম কী এবং এর অভাবে কোন রোগ হয়?",
            options: ["রেটিনল — রাতকানা", "ক্যালসিফেরল — রিকেট", "টোকোফেরল — মাংসপেশিতে টান", "থায়ামিন — বেরিবেরি"],
            correct: 0,
            explanation: "ভিটামিন 'এ' এর রাসায়নিক নাম রেটিনল এবং এর অভাবে রাতকানা রোগ হয়। অন্যদিকে ভিটামিন ডি-এর রাসায়নিক নাম ক্যালসিফেরল (অভাবজনিত রোগ: রিকেট)[cite: 2]। উপযুক্ত চার্ট অনুযায়ী প্রতিটি ভিটামিনের সুনির্দিষ্ট রাসায়নিক নাম ও রোগ মনে রাখতে হবে[cite: 2]."
        },
        {
            question: "ভিটামিন 'ডি' এর রাসায়নিক নাম কী এবং এর অভাবজনিত রোগ কোনটি?",
            options: ["ফিলো কুইনোন — রক্তক্ষরণ", "ক্যালসিফেরল — রিকেট", "টোকোফেরল — রিকেট", "রেটিনল — স্কার্ভি"],
            correct: 1,
            explanation: "ভিটামিন 'ডি' এর রাসায়নিক নাম ক্যালসিফেরল এবং এর অভাবে শিশুদের রিকেট রোগ হয়[cite: 2]। ভিটামিন 'কে' এর রাসায়নিক নাম ফিলো কুইনোন (অভাবজনিত রোগ: রক্তক্ষরণ)[cite: 2]."
        },
        {
            question: "মাংসপেশিতে টান বা দুর্বলতা কোন ভিটামিনের অভাবজনিত কারণে ঘটে এবং এর নাম কী?",
            options: ["ভিটামিন ই (টোকোফেরল)", "ভিটামিন কে (ফিলো কুইনোন)", "ভিটামিন সি (অ্যাসকরবিক এসিড)", "ভিটামিন বি১ (থায়ামিন)"],
            correct: 0,
            explanation: "ভিটামিন 'ই' এর রাসায়নিক নাম টোকোফেরল, যার অভাবে মাংসপেশিতে টান বা দুর্বলতা দেখা দেয়[cite: 2]। ভিটামিন 'কে' এর নাম ফিলো কুইনোন (অভাবজনিত রোগ: রক্তক্ষরণ)[cite: 2]."
        },
        {
            question: "রক্তক্ষরণ (Blood Hemorrhage) রোধে সাহায্যকারী ভিটামিন 'কে' এর রাসায়নিক নাম কী?",
            options: ["ক্যালসিফেরল", "টোকোফেরল", "ফিলো কুইনোন", "থায়ামিন"],
            correct: 2,
            explanation: "ভিটামিন 'কে' এর রাসায়নিক নাম ফিলো কুইনোন[cite: 2]। এর অভাবে রক্ত জমাট বাঁধতে দেরি হয় বা রক্তক্ষরণজনিত সমস্যা দেখা দেয়[cite: 2]."
        },
        {
            question: "বেরিবেরি (Beriberi) রোগটি কোন ভিটামিনের অভাবে হয় এবং এর রাসায়নিক নাম কী?",
            options: ["ভিটামিন বি১ — থায়ামিন", "ভিটামিন বি২ — রিবো-ফ্লাভিন", "ভিটামিন বি৬ — পিরিডক্সল", "ভিটামিন সি — অ্যাসকরবিক এসিড"],
            correct: 0,
            explanation: "ভিটামিন 'বি১' এর রাসায়নিক নাম থায়ামিন, যার অভাবে বেরিবেরি রোগ হয়[cite: 2]। ভিটামিন 'বি২' এর রাসায়নিক নাম রিবো-ফ্লাভিন (অভাবজনিত রোগ: ডার্মাটাইটিস বা জিহ্বায় প্রদাহ)[cite: 2]."
        },
        {
            question: "জিহ্বায় প্রদাহ বা ডার্মাটাইটিস কোন ভিটামিনের অভাবের সাথে সম্পর্কিত?",
            options: ["ভিটামিন বি১ (থায়ামিন)", "ভিটামিন বি২ (রিবো-ফ্লাভিন)", "ভিটামিন বি১২ (ফোলিক এসিড)", "ভিটামিন এ (রেটিনল)"],
            correct: 1,
            explanation: "ভিটামিন 'বি২' এর রাসায়নিক নাম রিবো-ফ্লাভিন, যার অভাবে ডার্মাটাইটিস বা জিহ্বায় প্রদাহ হয়[cite: 2]। ভিটামিন 'বি৬' এর রাসায়নিক নাম পিরিডক্সল (অভাবজনিত রোগ: ডার্মাটাইটিস)[cite: 2]."
        },
        {
            question: "রক্তশূন্যতা (Anemia) নিচের কোন ভিটামিনের অভাবের সাথে যুক্ত?",
            options: ["ভিটামিন বি১২ (ফোলিক এসিড)", "ভিটামিন সি (অ্যাসকরবিক এসিড)", "ভিটামিন ডি (ক্যালসিফেরল)", "ভিটামিন কে (ফিলো কুইনোন)"],
            correct: 0,
            explanation: "ভিটামিন 'বি১২' এর রাসায়নিক নাম ফোলিক এসিড, যার অভাবে মানবদেহে রক্তশূন্যতা দেখা দেয়[cite: 2]। এছাড়া ভিটামিন সি-এর অভাবে স্কার্ভি রোগ হয়[cite: 2]."
        },
        {
            question: "স্কার্ভি (Scurvy) রোগ প্রতিরোধের সাথে সংশ্লিষ্ট ভিটামিন সি এর রাসায়নিক নাম কী?",
            options: ["রেটিনল", "অ্যাসকরবিক এসিড", "টোকোফেরল", "থায়ামিন"],
            correct: 1,
            explanation: "ভিটামিন 'সি' এর রাসায়নিক নাম অ্যাসকরবিক এসিড এবং এর অভাবে স্কার্ভি রোগ হয়[cite: 2]। এটি মূলত কবীর স্যারের চার্টের শেষ অংশে উল্লেখ রয়েছে[cite: 2]."
        },
        {
            question: "ভিটামিন 'বি৬' এর রাসায়নিক নাম কী?",
            options: ["পিরিডক্সল", "রিবো-ফ্লাভিন", "থায়ামিন", "ফোলিক এসিড"],
            correct: 0,
            explanation: "ভিটামিন 'বি৬' এর রাসায়নিক নাম পিরিডক্সল, যার অভাবজনিত রোগ হলো ডার্মাটাইটিস[cite: 2]। আর ভিটামিন বি১২ হলো ফোলিক এসিড (রক্তশূন্যতা)[cite: 2]."
        },
        {
            question: "কবীর স্যারের চার্ট অনুযায়ী ফিলো কুইনোন কোন ভিটামিনের রাসায়নিক নাম?",
            options: ["ভিটামিন সি", "ভিটামিন ই", "ভিটামিন কে", "ভিটামিন ডি"],
            correct: 2,
            explanation: "ফিলো কুইনোন হলো ভিটামিন 'কে' এর রাসায়নিক নাম, যার অভাবে রক্তক্ষরণজনিত সমস্যা ঘটে[cite: 2]."
        }
    ];

    let currentQ = 0;
    let score = 0;
    let selectedOption = null;
    let isSubmitted = false;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const questionCount = document.getElementById('question-count');
    const scoreCount = document.getElementById('score-count');
    const progressBar = document.getElementById('progress-bar');
    const explanationBox = document.getElementById('explanation-box');
    const explanationText = document.getElementById('explanation-text');
    const actionBtn = document.getElementById('action-btn');
    const statusHint = document.getElementById('status-hint');

    function loadQuestion() {
        isSubmitted = false;
        selectedOption = null;
        
        const q = questions[currentQ];
        questionText.textContent = `${currentQ + 1}. ${q.question}`;
        
        questionCount.textContent = `প্রশ্ন ${currentQ + 1} / ${questions.length}`;
        scoreCount.textContent = `স্কোর: ${score}`;
        progressBar.style.width = `${((currentQ) / questions.length) * 100}%`;
        
        explanationBox.style.display = 'none';
        actionBtn.disabled = true;
        actionBtn.querySelector('span').textContent = 'জমা দিন';
        statusHint.textContent = 'কিবোর্ডের ১-৪ অথবা মাউস দিয়ে নির্বাচন করুন';

        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.onclick = () => selectOption(idx);
            
            card.innerHTML = `
                <div class="option-key">${idx + 1}</div>
                <div class="option-val">${opt}</div>
            `;
            optionsContainer.appendChild(card);
        });
    }

    function selectOption(index) {
        if (isSubmitted) return;
        
        selectedOption = index;
        const cards = optionsContainer.querySelectorAll('.option-card');
        cards.forEach((card, i) => {
            if (i === index) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        actionBtn.disabled = false;
        statusHint.textContent = 'জমা দিতে Enter চাপুন';
    }

    function handleAction() {
        if (!isSubmitted) {
            submitAnswer();
        } else {
            nextQuestion();
        }
    }

    function submitAnswer() {
        if (selectedOption === null || isSubmitted) return;
        
        isSubmitted = true;
        const q = questions[currentQ];
        const cards = optionsContainer.querySelectorAll('.option-card');

        cards[selectedOption].classList.remove('selected');

        if (selectedOption === q.correct) {
            cards[selectedOption].classList.add('correct');
            score++;
            scoreCount.textContent = `স্কোর: ${score}`;
        } else {
            cards[selectedOption].classList.add('incorrect');
            cards[q.correct].classList.add('correct');
        }

        explanationText.textContent = q.explanation;
        explanationBox.style.display = 'block';

        actionBtn.querySelector('span').textContent = 'পরবর্তী প্রশ্ন';
        statusHint.textContent = 'পরবর্তী প্রশ্নে যেতে Enter চাপুন';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showScoreScreen();
        }
    }

    function showScoreScreen() {
        document.getElementById('quiz-screen').style.display = 'none';
        const scoreScreen = document.getElementById('score-screen');
        scoreScreen.style.display = 'block';

        const percentage = Math.round((score / questions.length) * 100);
        document.getElementById('final-score').textContent = `${percentage}%`;
        document.getElementById('score-fraction').textContent = `${score}/${questions.length} সঠিক`;

        const circle = document.getElementById('score-circle');
        circle.style.background = `conic-gradient(var(--accent-green) ${percentage}%, #1e293b ${percentage}%)`;

        const feedback = document.getElementById('feedback-text');
        if (percentage >= 80) {
            feedback.textContent = "অসাধারণ! ভিটামিন সম্পর্কিত প্রস্তুতি একদম নিখুঁত! 🚀";
            feedback.style.color = "var(--accent-green)";
        } else if (percentage >= 50) {
            feedback.textContent = "ভালো হয়েছে! চার্টটি আর একবার দেখলে সম্পূর্ণ আয়ত্তে চলে আসবে। 👍";
            feedback.style.color = "var(--accent-blue)";
        } else {
            feedback.textContent = "চারটি ভালোভাবে পড়ে আবার কুইজটি চেষ্টা করুন। 💪";
            feedback.style.color = "var(--accent-red)";
        }
    }

    function restartQuiz() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('score-screen').style.display === 'block') {
            if (e.key === 'Enter') restartQuiz();
            return;
        }

        if (['1', '2', '3', '4'].includes(e.key)) {
            const index = parseInt(e.key) - 1;
            if (index < questions[currentQ].options.length) {
                selectOption(index);
            }
        } else if (e.key === 'Enter') {
            if (!actionBtn.disabled) {
                handleAction();
            }
        }
    });

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
