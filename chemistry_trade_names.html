<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Trade Names & Formulas - Medical Admission Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #151c2c;
            --bg-card-hover: #1e293b;
            --accent-green: #10b981;
            --accent-green-glow: rgba(16, 185, 129, 0.25);
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            padding: 32px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .title-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .keyboard-hint {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }

        kbd {
            background: #222e45;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 11px;
            color: #f1f5f9;
            box-shadow: 0 2px 0 #0f172a;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            transition: width 0.3s ease;
        }

        .question-stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 28px;
            color: var(--text-primary);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-card:hover {
            background: var(--bg-card-hover);
            border-color: #475569;
            transform: translateY(-1px);
        }

        .option-card.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .option-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(16, 185, 129, 0.12) !important;
            box-shadow: 0 0 15px var(--accent-green-glow) !important;
        }

        .option-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(239, 68, 68, 0.12) !important;
        }

        .option-key {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-secondary);
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-card.selected .option-key {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .option-card.correct .option-key {
            background: var(--accent-green);
            color: white;
            border-color: var(--accent-green);
        }

        .option-card.incorrect .option-key {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
        }

        .option-val {
            font-size: 16px;
            font-weight: 500;
            flex-grow: 1;
        }

        .explanation-box {
            background: rgba(30, 41, 59, 0.7);
            border-left: 4px solid var(--accent-blue);
            padding: 16px 20px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 28px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .explanation-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .explanation-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .score-board {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(var(--accent-green) 0%, #1e293b 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            position: relative;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .score-circle-inner {
            width: 120px;
            height: 120px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .score-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .container { padding: 20px; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .keyboard-hint { display: none; }
            .question-text { font-size: 17px; }
            .option-card { padding: 12px 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="quiz-screen">
        <div class="header">
            <div class="title-badge">
                <span class="badge">Medical Admission</span>
                <h1>কেমিক্যাল ট্রেড নেম ও সংকেত (Competitive Drill)</h1>
            </div>
            <div class="keyboard-hint">
                <span>কিবোর্ড:</span>
                <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd>
                <span>নির্বাচন</span> | 
                <kbd>Enter</kbd>
                <span>পরবর্তী</span>
            </div>
        </div>

        <div class="question-stats">
            <span id="question-count">প্রশ্ন ১ / ১০</span>
            <span id="score-count">স্কোর: ০</span>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-text" id="question-text">প্রশ্ন লোড হচ্ছে...</div>

        <div class="options-grid" id="options-container"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="explanation-title">💡 প্রতিযোগিতামূলক বিশ্লেষণ ও শর্টকাট ট্রিকস:</div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>

        <div class="footer">
            <span style="font-size: 13px; color: var(--text-secondary);" id="status-hint">একটি উত্তর নির্বাচন করুন</span>
            <button class="btn" id="action-btn" disabled onclick="handleAction()">
                <span>জমা দিন</span>
                <kbd style="background: rgba(255,255,255,0.2); border: none; box-shadow: none;">↵</kbd>
            </button>
        </div>
    </div>

    <div class="score-screen score-board" id="score-screen">
        <h2 style="font-size: 28px; margin-bottom: 8px;">ড্রিল সম্পন্ন হয়েছে! 🎉</h2>
        <p style="color: var(--text-secondary); margin-bottom: 32px;">আপনার পারফরম্যান্স রিপোর্ট নিচে দেওয়া হলো</p>
        
        <div class="score-circle" id="score-circle">
            <div class="score-circle-inner">
                <span class="score-number" id="final-score">০%</span>
                <span class="score-label" id="score-fraction">০/০ সঠিক</span>
            </div>
        </div>

        <p id="feedback-text" style="font-size: 18px; font-weight: 600; margin-bottom: 32px; color: var(--accent-green);"></p>

        <button class="btn" style="margin: 0 auto;" onclick="restartQuiz()">
            <span>পুনরায় চেষ্টা করুন</span>
        </button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "ভিট্রিওলের ট্রায়ো (Vitriols Trio) অনুযায়ী 'Green Vitriol' এর সঠিক রাসায়নিক সংকেত কোনটি?",
            options: ["CuSO₄·5H₂O", "FeSO₄·7H₂O", "ZnSO₄·7H₂O", "MgSO₄·7H₂O"],
            correct: 1,
            explanation: "মনে রাখার শর্টকাট ট্রিকস: Blue = কপার (CuSO₄·5H₂O), Green = আয়রন/ফেরাস (FeSO₄·7H₂O), White = জিঙ্ক (ZnSO₄·7H₂O)। এছাড়া সাধারণ FeSO₄ হলো অ্যানহাইড্রাস বা অনার্দ্র, কিন্তু গ্রিন ভিট্রিওলে অবশ্যই ৭ অণু ক্রিস্টাল পানি থাকে।"
        },
        {
            question: "লাইম ফ্যামিলি (Lime Family) এর ক্ষেত্রে 'Quicklime', 'Slaked lime' ও 'Milk of lime' এর সঠিক ক্রম কোনটি?",
            options: [
                "CaO → Ca(OH)₂ → Ca(OH)₂",
                "Ca(OH)₂ → CaO → CaCO₃",
                "CaO → CaCO₃ → Ca(OH)₂",
                "CaCO₃ → CaO → Ca(OH)₂"
            ],
            correct: 0,
            explanation: "ফাস্ট অ্যানালাইসিস: Quicklime হলো ক্যালসিয়াম অক্সাইড (CaO)। এতে পানি যোগ করলে Slaked lime বা পোড়া চুন থেকে কলি চুন অর্থাৎ Ca(OH)₂ তৈরি হয়। আর এই কলি চুনের পাতলা জলীয় সাসপেনশন বা দ্রবণকেই 'Milk of lime = Ca(OH)₂' বলা হয়।"
        },
        {
            question: "সোডিয়াম কার্বনেটের রূপভেদে 'Soda ash' এবং 'Washing soda' এর সঠিক সংকেত দুটির পার্থক্য কী?",
            options: [
                "Soda ash: Na₂CO₃ এবং Washing soda: Na₂CO₃·10H₂O",
                "Soda ash: NaHCO₃ এবং Washing soda: Na₂CO₃",
                "Soda ash: Na₂CO₃·10H₂O এবং Washing soda: Na₂CO₃",
                "Soda ash: NaOH এবং Washing soda: Na₂CO₃·10H₂O"
            ],
            correct: 0,
            explanation: "তুলনামূলক বিশ্লেষণ: সোডা অ্যাশ (Soda ash) হলো অনার্দ্র সোডিয়াম কার্বনেট (Na₂CO₃), আর যখন এতে ১০ অণু কেকাবিহীন ক্রিস্টাল জল যুক্ত হয়, তখন তাকে ওয়াশিং সোডা বা সোডিয়াম কার্বনেট ডেকাহাইড্রেট (Na₂CO₃·10H₂O) বলে।"
        },
        {
            question: "কপার পাইরাইটস বা চালকোপাইরাইট (Chalcopyrite) এর পরীক্ষামূলক সঠিক রাসায়নিক সংকেত কোনটি?",
            options: ["Cu₂S·Fe₂S₃", "CuFeS₂", "CuCO₃·Cu(OH)₂", "CuSO₄·5H₂O"],
            correct: 1,
            explanation: "সতর্কতামূলক কারেকশন: সাধারণ হাতখাতা বা পুরনো নোটে প্রায়ই ভুলবশত Cu₂S·Fe₂S₃ লেখা থাকে, যা আসলে একটি মিক্সড ফর্মুলা। এর আধুনিক ও সঠিক পরীক্ষামূলক সংকেত হলো CuFeS₂ (চালোকোপাইরাইট)।"
        },
        {
            question: "জিপসাম (Gypsum) এবং প্লাস্টার অফ প্যারিস (POP) এর সঠিক সংকেত দুটির অনুপাত কী?",
            options: [
                "Gypsum: CaSO₄·2H₂O এবং POP: CaSO₄·½H₂O",
                "Gypsum: CaSO₄·½H₂O এবং POP: CaSO₄·2H₂O",
                "Gypsum: MgSO₄·7H₂O এবং POP: CaSO₄·2H₂O",
                "Gypsum: CaCO₃·MgCO₃ এবং POP: CaSO₄·½H₂O"
            ],
            correct: 0,
            explanation: "কনফিউজিং অপশন এড়ানোর উপায়: জিপসাম হলো ক্যালসিয়াম সালফেট ডাইহাইড্রাইড (2 অণু পানি: CaSO₄·2H₂O)। একে উত্তপ্ত করলে পানি হারিয়ে হেমিহাইড্রেট বা আধা অণু পানিযুক্ত 'প্লাস্টার অফ প্যারিস' (CaSO₄·½H₂O) তৈরি হয়।"
        },
        {
            question: "মর্র্স সল্ট (Mohr's salt) এর সঠিক রাসায়নিক সংকেত কোনটি?",
            options: [
                "(NH₄)₂Fe(SO₄)₂·6H₂O",
                "FeSO₄·(NH₄)₂SO₄·7H₂O",
                "K₂SO₄·Al₂(SO₄)₃·24H₂O",
                "ZnSO₄·7H₂O"
            ],
            correct: 0,
            explanation: "বিশ্লেষণ: মর্র্স সল্ট হলো একটি দ্বৈত লবণ (Double salt) যার রাসায়নিক নাম অ্যামোনিয়াম ফেরাস সালফেট হেক্সাহাইড্রেট। এর সঠিক সংকেত হলো (NH₄)₂Fe(SO₄)₂·6H₂O (এখানে ৬ অণু পানি থাকে, যা পটাশ এলামের ২৪ অণু পানির সাথে গুলিয়ে ফেলা যাবে না)।"
        },
        {
            question: "ক্যালসিয়াম সালফেট বা অন্য যৌগের বাইরে 'Epsom salt' এবং 'Glauber’s salt' যথাক্রমে কোন দুটি যৌগকে নির্দেশ করে?",
            options: [
                "Epsom: MgSO₄·7H₂O এবং Glauber: Na₂SO₄·10H₂O",
                "Epsom: Na₂SO₄·10H₂O এবং Glauber: MgSO₄·7H₂O",
                "Epsom: ZnSO₄·7H₂O এবং Glauber: CuSO₄·5H₂O",
                "Epsom: CaSO₄·2H₂O এবং Glauber: NaNO₃"
            ],
            correct: 0,
            explanation: "মেমোরি ট্রিক: Epsom সল্টে ম্যাগনেসিয়াম সালফেট (MgSO₄·7H₂O) এবং Glauber's সল্টে সোডিয়াম সালফেট ডেকাহাইড্রেট (Na₂SO₄·10H₂O) থাকে। উভয় ক্ষেত্রেই বড় অণুর কোঁচ বা ক্রিস্টাল ওয়াটার রয়েছে।"
        },
        {
            question: "বোর্যাক্স (Borax) এর সঠিক রাসায়নিক সংকেত নিচের কোনটি?",
            options: ["Na₂B₄O₇·10H₂O", "H₃BO₃", "NaHCO₃", "Na₃AlF₆"],
            correct: 0,
            explanation: "তুলনা: বোর্যাক্স হলো সোডিয়াম টেট্রাবোরেট ডেকাহাইড্রেট (Na₂B₄O₇·10H₂O)। আর বোরিক এসিড হলো H₃BO₃। অপশনে পেঁচিয়ে যাওয়ার সুযোগ নেই যদি বোরন ও পানির অনুপাত (১০ অণু পানি) মাথায় থাকে।"
        },
        {
            question: "ক্রায়োলাইট (Cryolite) এর বিকল্প প্রকাশ রূপ কোনটি?",
            options: ["Na₃AlF₆ = 3NaF·AlF₃", "CaCO₃·MgCO₃", "CaOCl₂", "NH₄Cl"],
            correct: 0,
            explanation: "অ্যানালাইসিস: অ্যালুমিনিয়াম নিষ্কাশনে ফ্লাক্স হিসেবে ব্যবহৃত ক্রায়োলাইটের সংকেত Na₃AlF₆, যা ভেঙে 3NaF·AlF₃ হিসেবেও অনেক সময় পরীক্ষায় অপশনে থাকে। সুতরাং দুটি রূপই সমানভাবে গুরুত্বপূর্ণ।"
        },
        {
            question: "চিলি সল্টপিটার (Chile saltpetre) এবং ইন্ডিয়ান সল্টপিটার (Indian saltpetre) এর সঠিক রাসায়নিক রূপ কোনটি?",
            options: [
                "Chile: NaNO₃ এবং Indian: KNO₃",
                "Chile: KNO₃ এবং Indian: NaNO₃",
                "Chile: NaNO₂ এবং Indian: KNO₂",
                "Chile: NH₄Cl এবং Indian: NaNO₃"
            ],
            correct: 0,
            explanation: "ফাইনাল ট্রিক: সোডিয়াম নাইট্রেট (NaNO₃) হলো 'চিলি সল্টপিটার' (Chile), আর পটাশিয়াম নাইট্রেট (KNO₃) হলো 'ইন্ডিয়ান সল্টপিটার' বা সাধারণ 'সল্টপিটার'। নামের সাথে সোডিয়াম ও পটাশিয়ামের এই পার্থক্যটি ভালোভাবে খেয়াল রাখতে হবে।"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let selectedOption = null;
    let isSubmitted = false;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const questionCount = document.getElementById('question-count');
    const scoreCount = document.getElementById('score-count');
    const progressBar = document.getElementById('progress-bar');
    const explanationBox = document.getElementById('explanation-box');
    const explanationText = document.getElementById('explanation-text');
    const actionBtn = document.getElementById('action-btn');
    const statusHint = document.getElementById('status-hint');

    function loadQuestion() {
        isSubmitted = false;
        selectedOption = null;
        
        const q = questions[currentQ];
        questionText.textContent = `${currentQ + 1}. ${q.question}`;
        
        questionCount.textContent = `প্রশ্ন ${currentQ + 1} / ${questions.length}`;
        scoreCount.textContent = `স্কোর: ${score}`;
        progressBar.style.width = `${((currentQ) / questions.length) * 100}%`;
        
        explanationBox.style.display = 'none';
        actionBtn.disabled = true;
        actionBtn.querySelector('span').textContent = 'জমা দিন';
        statusHint.textContent = 'কিবোর্ডের ১-৪ অথবা মাউস দিয়ে নির্বাচন করুন';

        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.onclick = () => selectOption(idx);
            
            card.innerHTML = `
                <div class="option-key">${idx + 1}</div>
                <div class="option-val">${opt}</div>
            `;
            optionsContainer.appendChild(card);
        });
    }

    function selectOption(index) {
        if (isSubmitted) return;
        
        selectedOption = index;
        const cards = optionsContainer.querySelectorAll('.option-card');
        cards.forEach((card, i) => {
            if (i === index) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        });

        actionBtn.disabled = false;
        statusHint.textContent = 'জমা দিতে Enter চাপুন';
    }

    function handleAction() {
        if (!isSubmitted) {
            submitAnswer();
        } else {
            nextQuestion();
        }
    }

    function submitAnswer() {
        if (selectedOption === null || isSubmitted) return;
        
        isSubmitted = true;
        const q = questions[currentQ];
        const cards = optionsContainer.querySelectorAll('.option-card');

        cards[selectedOption].classList.remove('selected');

        if (selectedOption === q.correct) {
            cards[selectedOption].classList.add('correct');
            score++;
            scoreCount.textContent = `স্কোর: ${score}`;
        } else {
            cards[selectedOption].classList.add('incorrect');
            cards[q.correct].classList.add('correct');
        }

        explanationText.textContent = q.explanation;
        explanationBox.style.display = 'block';

        actionBtn.querySelector('span').textContent = 'পরবর্তী প্রশ্ন';
        statusHint.textContent = 'পরবর্তী প্রশ্নে যেতে Enter চাপুন';
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showScoreScreen();
        }
    }

    function showScoreScreen() {
        document.getElementById('quiz-screen').style.display = 'none';
        const scoreScreen = document.getElementById('score-screen');
        scoreScreen.style.display = 'block';

        const percentage = Math.round((score / questions.length) * 100);
        document.getElementById('final-score').textContent = `${percentage}%`;
        document.getElementById('score-fraction').textContent = `${score}/${questions.length} সঠিক`;

        const circle = document.getElementById('score-circle');
        circle.style.background = `conic-gradient(var(--accent-green) ${percentage}%, #1e293b ${percentage}%)`;

        const feedback = document.getElementById('feedback-text');
        if (percentage >= 80) {
            feedback.textContent = "অসাধারণ! কেমিক্যাল ট্রেড নেমের ওপর আপনার দখল দারুণ! 🚀";
            feedback.style.color = "var(--accent-green)";
        } else if (percentage >= 50) {
            feedback.textContent = "ভালো হয়েছে! তুলনামূলক বিশ্লেষণগুলো আরেকবার চোখ বুলিয়ে নিন। 👍";
            feedback.style.color = "var(--accent-blue)";
        } else {
            feedback.textContent = "চার্টটি রিভিশন দিয়ে ড্রিলটি আবার চেষ্টা করুন। 💪";
            feedback.style.color = "var(--accent-red)";
        }
    }

    function restartQuiz() {
        currentQ = 0;
        score = 0;
        document.getElementById('score-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
        if (document.getElementById('score-screen').style.display === 'block') {
            if (e.key === 'Enter') restartQuiz();
            return;
        }

        if (['1', '2', '3', '4'].includes(e.key)) {
            const index = parseInt(e.key) - 1;
            if (index < questions[currentQ].options.length) {
                selectOption(index);
            }
        } else if (e.key === 'Enter') {
            if (!actionBtn.disabled) {
                handleAction();
            }
        }
    });

    // Start Quiz
    loadQuestion();
</script>

</body>
</html>
